[workspace]
resolver = "2"
members = [
    "crates/terra-core",
    "crates/terra-assets",
    "crates/terra-gui",
    "crates/tforge-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 2
